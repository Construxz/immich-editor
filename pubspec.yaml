name: immich_editor
description: "Editor for Immich"
publish_to: 'none'
version: 0.1.0-dev.64+64

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: any
  photo_manager: ^3.12.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  # Schrift der Immich-App, SIL Open Font License 1.1 (fonts/GoogleSans/OFL.txt)
  fonts:
    - family: GoogleSans
      fonts:
        - asset: fonts/GoogleSans/GoogleSans-Regular.ttf
          weight: 400
        - asset: fonts/GoogleSans/GoogleSans-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSans/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: fonts/GoogleSans/GoogleSans-Bold.ttf
          weight: 700
